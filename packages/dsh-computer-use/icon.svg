<?xml version="1.0" encoding="UTF-8"?>
<!--
  Original mark for @cmm/dsh-computer-use, drawn for this bundle.
  It reads as "one window, read without taking it": a window outline whose
  contents are a 2x2 grid of accessibility elements, with the top-left element
  ringed (the element an observation resolved), and a small caret that stays
  outside the frame (no focus, no pointer).
  Original artwork: no third-party glyph, path or palette is used.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CMM Computer Use">
  <defs>
    <linearGradient id="cmmcu-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2433"/>
      <stop offset="1" stop-color="#0e1219"/>
    </linearGradient>
    <linearGradient id="cmmcu-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd4ff"/>
      <stop offset="1" stop-color="#3f8cff"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cmmcu-plate)"/>
  <rect x="9" y="12" width="38" height="30" rx="5" fill="none" stroke="#8ea0bd" stroke-width="2"/>
  <line x1="9" y1="20" x2="47" y2="20" stroke="#8ea0bd" stroke-width="2"/>
  <circle cx="13.5" cy="16" r="1.4" fill="#8ea0bd"/>
  <circle cx="18" cy="16" r="1.4" fill="#8ea0bd"/>

  <rect x="15" y="26" width="8" height="6" rx="2" fill="none" stroke="url(#cmmcu-ring)" stroke-width="2"/>
  <rect x="29" y="26" width="8" height="6" rx="2" fill="none" stroke="#5b6b86" stroke-width="2"/>
  <rect x="15" y="35" width="8" height="4" rx="2" fill="none" stroke="#5b6b86" stroke-width="2"/>
  <rect x="29" y="35" width="8" height="4" rx="2" fill="none" stroke="#5b6b86" stroke-width="2"/>

  <path d="M44 44 L44 55 L47 52 L49.5 57 L52 56 L49.5 51 L53.5 51 Z"
        fill="#e8f1ff" stroke="#0e1219" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
